# Folders scanned by `shelve move` when no input path is provided.
version = 2
inboxes = ["~/Desktop", "~/Downloads"]

# A section has a stable root, opened with `<sector>0`. Pins are resolved
# relative to that root and keep their configured order. Set children = true to
# append the root's other immediate, non-hidden directories alphabetically.
[[sections]]
root = "~"
pins = ["Desktop", "Downloads", "Documents"]
move_here = ["Documents"]
