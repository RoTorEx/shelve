# Folders scanned by `shelve move` when no input path is provided.
version = 2
inboxes = ["~/Desktop", "~/Downloads"]

# A section has a stable root, opened with `<sector>0`. Its immediate,
# non-hidden child directories are listed automatically. Use `promote` only to
# surface an important deeper descendant in the same flat list.
[[sections]]
root = "~/Documents"
