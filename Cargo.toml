[package]
name = "shelve"
version = "0.1.0"
edition = "2024"
description = "Tiny macOS CLI for opening folders and shelving PDFs"
license = "MIT"
repository = "https://github.com/RoTorEx/shelve"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
inquire = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
